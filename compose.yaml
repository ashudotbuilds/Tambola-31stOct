services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tambola
      POSTGRES_USER: tambola
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - tambola-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tambola -d tambola"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tambola-postgres:
